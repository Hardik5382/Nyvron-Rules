name: Compile CDN Filters

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Compiler Dependencies
        run: npm install adblock-rs@0.13.3

      - name: Build latest rules
        run: node tools/compile.js

      - name: Commit updated binary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cdn/v1/filters.bin
          git diff --cached --quiet && exit 0
          git commit -m "chore: Update compiled filters (adblock-rs@0.13.3)"
          git push origin main
