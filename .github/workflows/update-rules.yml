name: Update Nyvron Rules

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-rules:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build latest rules
        run: cargo run --release

      - name: Commit updated binary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add v2/latest-v0.12.5.nyv v2/latest-v0.12.5.nyv.sha256
          git diff --cached --quiet && exit 0
          git commit -m "Update compiled Nyvron rules v2"
          git push origin main

      - name: Purge jsDelivr Cache
        run: |
          curl --fail-with-body -sS -i "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/v2/latest-v0.12.5.nyv"
          curl --fail-with-body -sS -i "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/v2/latest-v0.12.5.nyv.sha256"
