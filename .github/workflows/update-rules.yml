name: Update Filters

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily
  workflow_dispatch: # Allows manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # REQUIRED for the push to succeed

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Compile latest.nyv
        run: cargo run --release # Or however you run your rust script

      - name: Commit and Push latest.nyv
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add latest.nyv
          git commit -m "Update filter rules [skip ci]" || echo "No changes to commit"
          git push
