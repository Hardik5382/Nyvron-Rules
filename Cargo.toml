[package]
name = "nyvron-rules"
version = "0.1.0"
edition = "2021"

[dependencies]
adblock = { version = "=0.8.2", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "deflate"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }